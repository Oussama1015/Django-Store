
<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <style>
        .product {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Our Products by Category</h1>
    {% regroup products by category as category_list %}
    {% for category in category_list %}
        <h2>{{ category.grouper }}</h2>
        {% for product in category.list %}
            <div class="product">
                <h3>{{ product.name }}</h3>
                <p>{{ product.description }}</p>
                <p>Price: ${{ product.price }}</p>
            </div>
        {% endfor %}
    {% endfor %}
</body>
</html>
