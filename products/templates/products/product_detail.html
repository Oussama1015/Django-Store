
<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }}</title>
    <style>
        .product-detail {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .back-link {
            margin: 20px;
        }
    </style>
</head>
<body>
    <div class="back-link">
        <a href="{% url 'products:product_list' %}">← Back to Products</a>
    </div>
    
    <div class="product-detail">
        <h1>{{ product.name }}</h1>
        <p><strong>Category:</strong> 
            <a href="{% url 'products:category_detail' product.category %}">
                {{ product.category }}
            </a>
        </p>
        <p><strong>Price:</strong> ${{ product.price }}</p>
        <p><strong>Description:</strong></p>
        <p>{{ product.description }}</p>
        <p><strong>Added:</strong> {{ product.created_at }}</p>
    </div>
</body>
</html>
